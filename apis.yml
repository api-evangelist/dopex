- aid: dopex:xsyk-staking-api
  name: Dopex xSYK Staking Positions API
  description: >-
    REST API for querying xSYK (escrowed SYK) staking and vesting positions for a given account address.
    Returns details of vested and staked xSYK allocations including total allocation amounts and pending
    vest positions. xSYK replaced the legacy DPX and rDPX token staking model following Dopex's evolution
    into the Stryke protocol with the SYK token merger.
  humanURL: https://docs.stryke.xyz/developers/apis/xsyk
  baseURL: https://api.stryke.xyz
