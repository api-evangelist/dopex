- aid: dopex:lp-management-api
  name: Dopex LP Management API
  description: >-
    REST API for liquidity providers participating in Dopex CLAMM vaults. Exposes endpoints to prepare
    deposit transaction calldata, query current LP positions for a given wallet address, retrieve deposit
    history, and retrieve withdrawal history. Used by LPs to manage capital in option liquidity pools
    and track earnings from option premium income on Arbitrum and supported EVM chains.
  humanURL: https://docs.stryke.xyz/developers/apis
